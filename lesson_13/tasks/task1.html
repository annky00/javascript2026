<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
</head>

<body>
    <!-- ! Задача 1. Генерація всіх підмножин: Реалізуйте рекурсивну функцію, яка генерує всі можливі підмножини заданого масиву. Наприклад, для масиву [1, 2, 3] можливі підмножини: [], [1], [2], [3], [1, 2], [1, 3], [2, 3], [1, 2, 3]. -->
    <script>
        let qty = parseInt(prompt("Enter the quantity of numbers", "3"))
        let array = []
        for (let i = 1; i <= qty; i++) {
            let num = parseInt(prompt(`Enter ${i} number`, `${i + 1}`))
            array.push(num)
        }
        document.write(`<h1>Your array: ${array.join(", ")}</h1>`)

        function getSubsets(arr) {
            let allSubsets = []
            function recurse(index, currentSubset) {
                if (index === arr.length) {
                    allSubsets.push(currentSubset)
                    return
                }
                recurse(index + 1, currentSubset)
                recurse(index + 1, [...currentSubset, arr[index]])
            }

            recurse(0, [])
            return allSubsets
        }

        document.write(`<h3>${getSubsets(array).join("<br>")}</h3>`)

    </script>
    <a href="../index.html">back</a>
</body>

</html>
