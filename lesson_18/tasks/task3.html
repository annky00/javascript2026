<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
</head>

<body>

    <div class="wrapper">
        <div class="calculator">
            <div class="inputs-area">
                <label for="birth">Enter the year of your birth:</label>
                <input type="number" id="birth">
                <label for="year">Enter current year:</label>
                <input type="number" id="year">
            </div>
            <div class="buttons-area">
                <button type="button" id="calculate">calculate</button>
            </div>
            <div>
                <p>You are ...</p>
                <p class="result"></p>
            </div>
        </div>
    </div>
    <style>
        body {
            background-color: black;
        }

        .calculator {
            background-color: rgb(97, 37, 27);
            margin: 0 auto;
            max-width: 250px;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgb(202, 202, 202);
        }

        .inputs-area {
            display: inline-flex;
            background-color: rgb(70, 27, 19);
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            padding: 5px;
        }

        input {
            border-radius: 5px;
        }

        button {
            background-color: black;
            border-radius: 5px;
            color: white;
            transition: all 0.5s;
            padding: 2px 10px;
        }

        button:hover {
            background-color: rgb(73, 4, 4);
            transition: all 0.5s;
        }
    </style>
    <!-- ! Задача 3. Користувач задає рік народження. Визначити кількість років користувача.  -->
    <script>
        function calculateAge() {
            const birthYearEl = document.getElementById("birth")
            const birthYear = Number(birthYearEl.value)
            const currentYearEl = document.getElementById("year")
            const currentYear = Number(currentYearEl.value)

            let result = currentYear - birthYear

            let resultEl = document.querySelector(".result")
            resultEl.innerText = result + "yo."
        }

        const btn = document.getElementById("calculate")
        btn.onclick = calculateAge

    </script>
    <a href="../index.html" style="font-size: 25px; color: white;">back</a>
</body>

</html>
