<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
</head>

<body>
    <div class="wrapper">
        <div class="converter">
            <div class="inputs-area">
                <label for="UAH">UAH SUM</label>
                <input type="number" id="UAH">
            </div>
            <div class="buttons-area">
                <button type="button" id="converter">Calculate</button>
            </div>
            <div class="results">
                <p>EUR SUM:</p>
                <p class="eur-result"></p>
                <p>USD SUM:</p>
                <p class="usd-result"></p>
            </div>
        </div>
    </div>
    <style>
        body {
            background-color: black;
        }

        .converter {
            background-color: rgb(97, 37, 27);
            margin: 0 auto;
            max-width: 250px;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgb(202, 202, 202);
        }

        .inputs-area {
            display: inline-flex;
            background-color: rgb(70, 27, 19);
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            padding: 5px;
        }

        input {
            border-radius: 5px;
        }

        button {
            background-color: black;
            border-radius: 5px;
            color: white;
            transition: all 0.5s;
            padding: 2px 10px;
        }

        button:hover {
            background-color: rgb(73, 4, 4);
            transition: all 0.5s;
        }
    </style>
    <!-- ! Задача 2. Зробити конвертер валют (курси валют – константи у скрипті) -->
    <script>
        const EUR = 51.36
        const USD = 44.29

        function converter() {
            const uahEl = document.getElementById("UAH")
            let uahVal = Number(uahEl.value)

            let eurVal = uahVal / EUR
            let usdVal = uahVal / USD

            let usdResEl = document.querySelector(".usd-result")
            usdResEl.innerText = usdVal
            let eurResEl = document.querySelector(".eur-result")
            eurResEl.innerText = eurVal
        }

        const btn = document.getElementById("converter")
        btn.onclick = converter


    </script>
    <a href="../index.html" style="font-size: 25px; color: white;">back</a>
</body>

</html>
